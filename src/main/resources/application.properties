spring.datasource.url=jdbc:h2:mem:arq_software
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Evita conflito local quando outra aplicação estiver usando 8080
server.port=8081

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=always

# Mantem o contexto AWS inicializavel fora da EC2 sem exigir metadata
cloud.aws.region.static=${AWS_DEFAULT_REGION:us-east-1}
cloud.aws.stack.auto=false
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:local-access-key}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:local-secret-key}

